[project]
name = "ha-nisc-smarthub"
version = "0.0.0"
description = "Home Assistant integration for NISC SmartHub electric co-op portals: usage and cost statistics for the Energy dashboard"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "ruff>=0.11.7",
  "basedpyright>=1.31.7",
  "pytest>=9.0.2",
]

[tool.ruff]
line-length = 88
target-version = "py314"
# ruff 0.16 formats Python code blocks inside Markdown by default; docs here
# quote partial snippets and harvested prose, so keep ruff to Python sources.
include = ["*.py", "*.pyi", "**/pyproject.toml"]
extend-exclude = [".venv", ".git", "build", "config"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RUF", # ruff-specific rules
]
ignore = [
  "E501", # line too long (handled by line-length)
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
exclude = ["**/__pycache__", ".venv", "build", "dist", "config"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
reportMissingImports = "error"
reportMissingTypeStubs = "error"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q --tb=short --strict-markers"
filterwarnings = ["error"]
