[tools]
python = "3.14"
uv = "0.12.23"
hk = "2.5.0"
markdownlint-cli2 = "0.23.3"
fnox = "1.38.1"
"1password-cli" = "2.39.0"

[settings]
env_cache = true

[env]
_.python.venv = { path = ".venv", create = true }
# Pin uv to mise's interpreter so it never downloads its own Python and rebuilds
# .venv underneath mise.
UV_PYTHON = { value = "{{ tools.python.path }}/bin/python", tools = true }
HK_MISE = "1"

[hooks]
enter = "mise run --quiet bootstrap"

[tasks.bootstrap]
description = "Prepare the repo for a new shell"
depends = ["bootstrap:*"]

[tasks."bootstrap:deps"]
description = "Sync Python dependencies into .venv"
run = "uv sync --dev"
# pyvenv.cfg is a source so that deleting .venv resyncs it.
sources = ["pyproject.toml", "uv.lock", ".venv/pyvenv.cfg"]
outputs = { auto = true }
quiet = true

[tasks."bootstrap:hooks"]
description = "Install git hooks"
run = "hk install --mise --quiet"
sources = ["mise.toml", "hk.pkl"]
outputs = { auto = true }
quiet = true

[tasks.check]
description = "Run every non-mutating check across the repo"
depends = [
  "bootstrap:deps",
  "docs:lint",
  "python:fmt:check",
  "python:lint",
  "python:typecheck",
  "strings:check",
]

[tasks.fix]
description = "Run every mutating formatter and autofixer across the repo"
depends = [
  "docs:lint:fix",
  "python:fmt",
  "python:lint:fix",
]

[tasks."docs:lint"]
description = "Lint Markdown"
run = "markdownlint-cli2"

[tasks."docs:lint:fix"]
description = "Autofix Markdown lint findings"
run = "markdownlint-cli2 --fix"

[tasks."python:lint"]
description = "Report ruff lint findings"
run = "ruff check ."

# Separate from `python:lint` because --unsafe-fixes rewrites code in ways worth
# reading; it stays out of the commit path and off `check`.
[tasks."python:lint:fix"]
description = "Apply ruff lint fixes, including unsafe ones"
run = "ruff check --fix --unsafe-fixes ."

[tasks."python:fmt"]
description = "Format Python sources with ruff"
run = "ruff format ."

[tasks."python:fmt:check"]
description = "Report Python sources ruff would reformat"
run = "ruff format --check ."

[tasks."python:typecheck"]
description = "Type-check Python with basedpyright"
run = "basedpyright"

[tasks.test]
description = "Run the test suite with coverage"
depends = ["bootstrap:deps"]
run = "pytest"

[tasks."strings:check"]
description = "Check strings.json and translations/en.json against each other"
depends = ["bootstrap:deps"]
run = "python scripts/check_strings.py"

[tasks.dev]
description = "Run Home Assistant against the checked-out integration"
depends = ["bootstrap:deps"]
run = """
set -euo pipefail
link=config/custom_components
if [ -L "$link" ]; then
  target=$(readlink "$link")
  if [ "$target" != "../custom_components" ]; then
    echo "$link points at $target, not ../custom_components" >&2
    exit 1
  fi
elif [ -e "$link" ]; then
  echo "$link exists and is not a symlink" >&2
  exit 1
else
  ln -s ../custom_components "$link"
fi
if [ ! -f config/configuration.yaml ]; then
  uv run --no-sync hass --config "$PWD/config" --script ensure_config
fi
uv run --no-sync hass --config "$PWD/config" --debug --skip-pip
"""

[tasks."dev:bootstrap"]
description = "Onboard the running dev instance and mint an agent token"
depends = ["bootstrap:deps"]
run = "python scripts/dev_bootstrap.py"

[tasks.release]
description = "Bump the manifest version, tag it, and publish a GitHub release"
run = "python scripts/release.py {{arg(name='version')}}"

[tasks."fixtures:capture"]
description = "Re-record the SmartHub fixtures from the live portal through the agent-vault identity"
run = "fnox --no-daemon --non-interactive exec -- python scripts/capture_fixtures.py"
